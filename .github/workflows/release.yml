name: Build modpacks

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload to (e.g. 1.0.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .builder
          sparse-checkout: .github/scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build packs
        run: python .builder/.github/scripts/build_packs.py --tag "$TAG"
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}

      - name: Upload to release
        run: gh release upload "$TAG" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
